name: Docker Interop Image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # interop/runner/Dockerfile packages pre-built binaries; its COPY paths
      # are relative to the staging dir, as in interop/runner/build_image.sh.
      - name: Cross-compile interop binaries
        run: |
          zig build interop -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-gnu -j1 --prefix "$PWD/stage"
          cp interop/runner/run_endpoint.sh stage/run_endpoint.sh

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: stage
          file: interop/runner/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          platforms: linux/amd64
