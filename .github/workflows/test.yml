name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows dropped during Zig 0.16 port — src/sys.zig, sockaddr, and
        # the libxev dep have @compileError branches for Windows pending a
        # proper Winsock implementation.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      - name: Fuzz (smoke test)
        run: zig build fuzz

      # The Zig leg of the WebTransport conformance suite: a real client and a
      # real server over a socket, no browser needed. The browser legs stay
      # local — see SPEC/webtransport_conformance.md.
      - name: WebTransport conformance (Zig client)
        run: ./tools/wt_conformance.sh --zig-only
